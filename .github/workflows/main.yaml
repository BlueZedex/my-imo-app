name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Android Project Files
        run: flutter create .
      - name: Get Dependencies
        run: flutter pub get
      - name: Force All Subprojects to SDK 37 & Fix JCenter
        run: |
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          cat << 'EOF' >> android/build.gradle.kts
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      extensions.configure<com.android.build.gradle.BaseExtension>("android") {
                          compileSdkVersion(37)
                          defaultConfig {
                              minSdk = 24
                          }
                      }
                  }
              }
          }
          EOF
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts
          fi
      - name: Build Debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-imo-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
